<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせアプリ 試作品デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { background: #eceae4; }
  .head { padding: 20px 24px 8px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .head h1 { font-size: 22px; color: var(--navy); }
  .head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .head .btn { margin-left: auto; }
  .stage { display: grid; grid-template-columns: 390px 1fr; gap: 24px; padding: 12px 24px 24px; align-items: start; }
  .col h2 { font-size: 14px; color: var(--navy); margin-bottom: 8px; }
  .col h2 span { color: var(--gold); margin-right: 6px; }
  .phone { width: 390px; height: 760px; border: 12px solid #1b1b1f; border-radius: 44px; overflow: hidden; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .phone iframe, .pc iframe { width: 100%; height: 100%; border: 0; display: block; }
  .pc { height: 760px; border: 1px solid #c9c6bd; border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.12); }
  @media (max-width: 1000px) { .stage { grid-template-columns: 1fr; } .phone { margin: 0 auto; width: min(390px, 100%); } }
</style>
</head>
<body>
<div class="head">
  <div>
    <h1>公式LINE お問い合わせアプリ（試作品）</h1>
    <p>左＝保護者・中学生のスマホ（LINEのメニューから開く画面）　右＝教職員の管理画面。左で質問を送ると右に届き、右で回答すると左に通知が届きます。</p>
  </div>
  <button class="btn small ghost" id="seed">見本の質問を入れる</button>
  <button class="btn small ghost" id="reset">データを消す</button>
</div>
<div class="stage">
  <div class="col"><h2><span>①</span>質問する人のスマホ</h2><div class="phone"><iframe src="index.html?demo" title="質問者の画面"></iframe></div></div>
  <div class="col"><h2><span>②</span>教職員の管理画面</h2><div class="pc"><iframe src="admin.html?demo" title="管理画面"></iframe></div></div>
</div>
<script src="store.js"></script>
<script>
document.getElementById('reset').onclick = () => Store.reset();
document.getElementById('seed').onclick = () => {
  Store.create({ userId: 'sample-1', displayName: 'みか', name: '山本 美香', role: '保護者', school: '下関市立〇〇中学校', category: '学費・奨学金', text: '兄弟で通う場合の学費の減免はありますか？' });
  Store.create({ userId: 'sample-2', displayName: 'そうた', name: '田中 颯太', role: '中学生', school: '', category: '学校生活・部活', text: '高校からサッカー部に入っても、ついていけますか？' });
};
</script>
</body>
</html>
