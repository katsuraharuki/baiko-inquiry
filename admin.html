<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--navy); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 17px; }
  header .gold { color: var(--gold); font-size: 12px; letter-spacing: .2em; }
  header .me { margin-left: auto; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  header select { width: auto; padding: 4px 8px; font-size: 13px; }
  .stats { display: flex; gap: 10px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; background: #fff; text-align: left; }
  .stat.on { border-color: var(--navy); box-shadow: inset 0 -3px 0 var(--gold); }
  .stat b { font-family: var(--mincho); font-size: 20px; margin-left: 6px; }
  .wrap { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  .list { border-right: 1px solid var(--line); overflow-y: auto; background: #fff; }
  .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 12px 16px; }
  .row.on { background: var(--gold-soft); }
  .row .top { display: flex; justify-content: space-between; gap: 8px; }
  .row .name { font-weight: 700; }
  .row .preview { margin: 4px 0 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; }
  .info { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 14px; font-size: 13px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; }
  .tools { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .tools select { width: auto; padding: 6px 10px; font-size: 13px; }
  .thread { flex: 1; }
  .msg.user { align-self: flex-start; background: #fff; color: var(--ink); border: 1px solid var(--line); border-bottom-left-radius: 2px; border-bottom-right-radius: 12px; }
  .msg.user .meta { color: var(--muted); }
  .msg.staff { align-self: flex-end; background: var(--navy); color: #fff; border: 0; border-bottom-right-radius: 2px; border-bottom-left-radius: 12px; }
  .msg.staff .who { color: var(--gold); }
  .msg.staff .meta { color: #c9d1e3; }
  .composer { margin-top: 16px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .temps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .temps button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; font-size: 12px; }
  .composer .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  @media (max-width: 760px) {
    body { height: auto; }
    .wrap { grid-template-columns: 1fr; }
    .list { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .info { grid-template-columns: auto 1fr; }
  }
</style>
</head>
<body>
<header>
  <div><div class="gold">BAIKO GAKUIN</div><h1>お問い合わせ管理</h1></div>
  <div class="me">対応者
    <select id="staff"><option>重村</option><option>入試広報部</option><option>事務室</option></select>
  </div>
</header>
<div class="stats" id="stats"></div>
<div class="wrap">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"></div>
</div>

<script src="config.js"></script>
<script src="store.js"></script>
<script>
// 定型文：よく返す答えをワンタップで入れる（本番は学校で文面を決める）
const TEMPLATES = {
  'お礼': 'お問い合わせありがとうございます。梅光学院入試広報部です。\n',
  '説明会の案内': '11月7日・11月28日の入試説明会で、詳しくご説明しております。公式LINEのメニュー「説明会の申込」からお申し込みください。\n',
  '確認して連絡': '担当者に確認のうえ、改めてご連絡いたします。少々お待ちください。\n',
  '締め': '\nほかにもご不明な点がありましたら、この画面からお気軽にご質問ください。',
};
let filter = '未対応', openId = null;
const staffSel = document.getElementById('staff');

function render() {
  const all = Store.all();
  const count = (s) => all.filter((q) => q.status === s).length;
  document.getElementById('stats').innerHTML = ['未対応', '対応中', '回答済み', 'すべて'].map((s) => `
    <button class="stat ${filter === s ? 'on' : ''}" data-f="${s}">${s}<b>${s === 'すべて' ? all.length : count(s)}</b></button>`).join('');
  document.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { filter = b.dataset.f; render(); }));

  const shown = filter === 'すべて' ? all : all.filter((q) => q.status === filter);
  document.getElementById('list').innerHTML = shown.length ? shown.map((q) => `
    <button class="row ${q.id === openId ? 'on' : ''}" data-id="${q.id}">
      <div class="top"><span class="name">${esc(q.name)}<span class="muted">（${esc(q.role)}）</span></span><span class="badge ${q.status}">${q.status}</span></div>
      <div class="muted">${esc(q.category)}・${fmt(q.updatedAt)}${q.assignee ? '・担当 ' + esc(q.assignee) : ''}</div>
      <p class="preview">${esc(q.messages[q.messages.length - 1].text)}</p>
    </button>`).join('') : '<p class="muted" style="padding:16px">該当する問い合わせはありません</p>';
  document.querySelectorAll('.row').forEach((b) => (b.onclick = () => { openId = b.dataset.id; render(); }));
  renderDetail(Store.get(openId));
}

function renderDetail(q) {
  const d = document.getElementById('detail');
  if (!q) { d.innerHTML = '<div class="empty">左の一覧から問い合わせを選んでください</div>'; return; }
  const draft = document.getElementById('reply')?.dataset.for === q.id ? document.getElementById('reply').value : '';
  d.innerHTML = `
    <dl class="info">
      <dt>お名前</dt><dd>${esc(q.name)}（LINE：${esc(q.displayName)}）</dd>
      <dt>立場</dt><dd>${esc(q.role)}</dd>
      <dt>中学校</dt><dd>${esc(q.school) || '―'}</dd>
      <dt>受付</dt><dd>${q.id}・${fmt(q.createdAt)}</dd>
    </dl>
    <div class="tools">
      <span class="badge ${q.status}">${q.status}</span>
      <select id="assignee"><option value="">担当者なし</option>${['重村', '入試広報部', '事務室'].map((n) => `<option ${q.assignee === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
      ${q.status === '未対応' ? '<button class="btn small ghost" id="take">自分が対応する</button>' : ''}
    </div>
    <div class="thread">${q.messages.map((m) => m.from === 'user'
      ? `<div class="msg user">${esc(m.text)}<span class="meta">${esc(q.name)}・${fmt(m.at)}</span></div>`
      : `<div class="msg staff"><span class="who">${esc(m.staffName)}</span>${esc(m.text)}<span class="meta">${fmt(m.at)}</span></div>`).join('')}
    </div>
    <div class="composer">
      <div class="temps">${Object.keys(TEMPLATES).map((k) => `<button data-t="${k}">${k}</button>`).join('')}</div>
      <textarea id="reply" data-for="${q.id}" placeholder="回答を入力">${esc(draft)}</textarea>
      <div class="foot">
        <span class="muted">送ると、質問者の公式LINEに「回答が届きました」と1通届きます</span>
        <button class="btn small" id="send">回答を送る</button>
      </div>
    </div>`;
  const reply = document.getElementById('reply');
  document.getElementById('assignee').onchange = (e) => Store.update(q.id, { assignee: e.target.value });
  const take = document.getElementById('take');
  if (take) take.onclick = () => Store.update(q.id, { status: '対応中', assignee: staffSel.value });
  d.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { reply.value += TEMPLATES[b.dataset.t]; reply.focus(); }));
  document.getElementById('send').onclick = () => {
    const t = reply.value.trim();
    if (!t) return;
    reply.value = '';
    Store.addMessage(q.id, { from: 'staff', text: t, staffName: staffSel.value });
    if (!q.assignee) Store.update(q.id, { assignee: staffSel.value });
  };
}

window.addEventListener('store-changed', render);
render();

// 本番：合言葉で入り、15秒ごとに新しい問い合わせを取る
async function connect() {
  let key;
  try { key = localStorage.getItem('baiko-admin-key'); } catch {}
  if (!key) key = prompt('管理画面の合言葉を入力してください');
  if (!key) return;
  Store.setAuth({ adminKey: key });
  try {
    await Store.refresh();
    try { localStorage.setItem('baiko-admin-key', key); } catch {}
    setInterval(() => Store.refresh().catch(() => {}), 15000);
  } catch (e) {
    try { localStorage.removeItem('baiko-admin-key'); } catch {}
    alert(e.message === 'unauthorized' ? '合言葉が違います' : '通信できませんでした：' + e.message);
    connect();
  }
}
if (Store.remote) connect();
</script>
</body>
</html>
